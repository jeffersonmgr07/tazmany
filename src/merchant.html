<template id="merchantDashboardTemplate">
  <div class="dashboard-shell merchant-dashboard">
    <aside class="dashboard-sidebar merchant-sidebar">
      <div class="dashboard-identity"><span class="avatar avatar-lg avatar-navy" data-merchant-initials>SL</span><div><small>Panel de comercio</small><strong data-merchant-name>Sabores de Lima</strong><em><span class="status-dot"></span> Verificado</em></div></div>
      <nav class="dashboard-nav"><button class="active" type="button"><span class="icon" data-icon="grid"></span>Resumen</button><button type="button"><span class="icon" data-icon="scan"></span>Canjear cupón</button><button type="button"><span class="icon" data-icon="campaign"></span>Campañas</button><button type="button"><span class="icon" data-icon="calendar"></span>Reservas</button><button type="button"><span class="icon" data-icon="wallet"></span>Liquidaciones</button><button type="button"><span class="icon" data-icon="star"></span>Reseñas</button><button type="button"><span class="icon" data-icon="branch"></span>Sucursales</button><button type="button"><span class="icon" data-icon="users"></span>Equipo</button><button type="button"><span class="icon" data-icon="settings"></span>Configuración</button></nav>
      <div class="sidebar-help navy-help"><span class="icon" data-icon="support"></span><strong>Centro para comercios</strong><p>Resuelve dudas operativas.</p><button type="button">Solicitar ayuda</button></div>
    </aside>
    <div class="dashboard-main">
      <div class="dashboard-topline"><div><span class="dashboard-eyebrow">PANEL DEL COMERCIO · FASE 3</span><h1>Buenos días, Mariana</h1><p>Así se está moviendo tu negocio hoy.</p></div><div class="topline-actions"><button class="button button-outline" type="button" id="merchantContractButton"><span class="icon" data-icon="receipt"></span> Contrato</button><button class="button button-primary" type="button" id="scanCouponButton"><span class="icon" data-icon="scan"></span> Escanear cupón</button></div></div>
      <section class="phase-banner"><span class="icon" data-icon="verified"></span><div><strong>Comercio, campañas y moderación conectados</strong><p>Los borradores, versiones y revisiones ya se registran en Sheets con permisos de backend.</p></div><button type="button" class="button button-small button-outline" id="merchantProfileButton">Ver expediente</button></section>
      <div class="stat-grid merchant-stats"><article><span class="stat-icon savings"><span class="icon" data-icon="trend"></span></span><div><small>Ventas de hoy</small><strong data-stat-money="salesTodayCents">S/ 0.00</strong><p class="positive">↑ 12.8% frente al lunes</p></div></article><article><span class="stat-icon success"><span class="icon" data-icon="verified"></span></span><div><small>Canjes de hoy</small><strong data-stat="redemptionsToday">0</strong><p>En 2 sucursales</p></div></article><article><span class="stat-icon navy"><span class="icon" data-icon="coupon"></span></span><div><small>Cupones por atender</small><strong data-stat="activeCoupons">0</strong><p>Vigentes y vendidos</p></div></article><article><span class="stat-icon amber"><span class="icon" data-icon="wallet"></span></span><div><small>Próximo pago estimado</small><strong data-stat-money="nextPayoutCents">S/ 0.00</strong><p>Programado para el martes</p></div></article></div>
      <div class="dashboard-grid-main">
        <section class="dashboard-panel sales-panel"><div class="panel-heading"><div><span class="panel-kicker">RENDIMIENTO</span><h2>Ventas de los últimos 7 días</h2></div><select aria-label="Periodo"><option>Esta semana</option></select></div><div class="sales-chart" data-sales-chart></div><div class="chart-labels"><span>Lun</span><span>Mar</span><span>Mié</span><span>Jue</span><span>Vie</span><span>Sáb</span><span>Dom</span></div></section>
        <section class="dashboard-panel redemption-panel"><div class="panel-heading"><div><span class="panel-kicker">ACTIVIDAD EN VIVO</span><h2>Últimos canjes</h2></div><button type="button">Ver todos</button></div><div class="redemption-list" data-redemption-list></div></section>
      </div>
      <section class="dashboard-panel campaign-panel"><div class="panel-heading"><div><span class="panel-kicker">TUS OFERTAS</span><h2>Campañas</h2></div><button class="button button-small button-outline" id="newCampaignButton" type="button">+ Nueva campaña</button></div><div class="campaign-table-wrap"><table class="campaign-table"><thead><tr><th>Campaña</th><th>Estado</th><th>Vendidos</th><th>Stock</th><th>Ingresos brutos</th><th></th></tr></thead><tbody data-campaign-table></tbody></table></div></section>
    </div>
  </div>
</template>

<dialog class="simple-dialog scan-dialog" id="scanDialog" aria-labelledby="scanDialogTitle"><button class="dialog-close icon-button" type="button" aria-label="Cerrar"><span class="icon" data-icon="close"></span></button><span class="scan-frame"><i></i><i></i><i></i><i></i><b>QR</b></span><h2 id="scanDialogTitle">Escáner disponible en la Fase 5</h2><p>La interfaz de canje ya está prevista, pero la validación atómica del cupón se habilitará junto con QR, permisos y auditoría.</p><label>Código manual de demostración<input type="text" value="TAZ-DEMO-7K2P" readonly></label><button class="button button-primary button-block" type="button" data-close-dialog>Entendido</button></dialog>
