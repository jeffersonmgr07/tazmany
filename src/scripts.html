18M9 10h6m-6 4h6m-6 4h6"/>',users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3A1.7 1.7 0 0 0 10 3V2.8h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M5 21h14"/>',trend:'<path d="m3 17 6-6 4 4 8-9"/><path d="M15 6h6v6"/>'
  };
  ICONS.crown='<path d="m3 7 4 4 5-7 5 7 4-4-2 11H5L3 7Z"/><path d="M6 21h12"/>';
  ICONS.mail='<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>';
  const CATEGORY_ICON_IDS = new Set(['all','restaurant','sparkles','wellness','fitness','car','ticket','travel','services','products','home','education','pets','gifts','digital','seasonal']);
  const money = cents => new Intl.NumberFormat('es-PE',{style:'currency',currency:'PEN',minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(cents||0)/100);
  const date = value => value ? new Intl.DateTimeFormat('es-PE',{day:'2-digit',month:'short',year:'numeric',timeZone:'America/Lima'}).format(new Date(value)) : '';
  const escapeHtml = value => String(value??'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));

  const state = { view:'home', publicData:null, publicCacheRendered:false, backendAvailable:false, query:'', categoryId:'', favorites:new Set(), customerLoaded:false, customerData:null, customerPromise:null, merchantLoaded:false, adminLoaded:false, merchantWorkspace:null, auth:null, otpChallenge:null, googleNonce:'', googleLoginPending:false, location:readStoredLocation() };
  const fallback = createFallbackData();
  const PUBLIC_CACHE_TTL_MS = 24*60*60*1000;

  document.addEventListener('DOMContentLoaded', init);
  async function init(){
    applyLogo();hydrateIcons(document);populatePhoneCountries('PE');bindGlobalEvents();const cached=hydrateCachedPublicData();if(!cached)renderInitialCategoryStrip();await Promise.all([loadPublicData({silent:cached}),restoreSession()]);initGoogleIdentity();if(state.auth&&!state.auth.needsProfile)prefetchCustomerDashboard().catch(()=>{});navigate(window.TAZMANY_INITIAL_VIEW||'home',false);initDiscoveryExperience();
  }
  function renderInitialCategoryStrip(){const current=state.publicData;state.publicData={categories:fallback.categories};renderCategories();state.publicData=current;syncLocationLabels();renderClubPlan()}
  function applyLogo(){
    const url=window.TAZMANY_CONFIG&&window.TAZMANY_CONFIG.logoUrl;
    if(!url)return;[['brandLogo','brandFallback'],['footerBrandLogo','footerBrandFallback']].forEach(([imageId,fallbackId])=>{const img=document.getElementById(imageId);if(!img)return;img.src=url;img.onload=()=>{img.hidden=false;document.getElementById(fallbackId).hidden=true};img.onerror=()=>{img.hidden=true}});
  }
  function hydrateIcons(root){
    root.querySelectorAll('[data-icon]:not([data-icon-ready])').forEach(el=>{const name=el.dataset.icon;el.innerHTML=`<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]||ICONS.sparkle}</svg>`;el.dataset.iconReady='1'});
  }
  function categoryIconMarkup(name,className=''){
    const safe=CATEGORY_ICON_IDS.has(String(name))?String(name):'all';
    return `<svg class="category-icon ${className}" viewBox="0 0 32 32" aria-hidden="true"><use href="#taz-cat-${safe}"></use></svg>`;
  }
  function bindGlobalEvents(){
    document.addEventListener('click',event=>{
      const route=event.target.closest('[data-route]');if(route){navigate(route.dataset.route);closeProfileMenu();return}
      if(event.target.closest('[data-clear-filter]')){state.query='';state.categoryId='';syncSearchInputs('');renderCategories();renderOffers();return}
      if(event.target.closest('[data-focus-search]')){navigate('home');setTimeout(()=>document.getElementById('mobileSearchInput').focus(),80);return}
      if(event.target.closest('[data-open-location]')){openLocationDialog();return}
      if(event.target.closest('[data-open-club]')){document.getElementById('clubDialog').showModal();return}
      if(event.target.closest('[data-dismiss-location]')){document.getElementById('locationDialog').close();return}
      if(event.target.closest('[data-dismiss-subscriber]')){rememberSubscriberDismissal();document.getElementById('subscriberDialog').close();return}
      if(event.target.closest('[data-close-dialog]'))event.target.closest('dialog')?.close();
      if(!event.target.closest('#profileSwitcher')&&!event.target.closest('#profileMenu'))closeProfileMenu();
    });
    document.getElementById('profileSwitcher').addEventListener('click',()=>{if(!state.auth){openAuthDialog();return}const menu=document.getElementById('profileMenu');menu.hidden=!menu.hidden;document.getElementById('profileSwitcher').setAttribute('aria-expanded',String(!menu.hidden))});
    document.getElementById('loginMenuButton').addEventListener('click',openAuthDialog);
    document.getElementById('logoutMenuButton').addEventListener('click',logout);
    document.getElementById('sessionsMenuButton').addEventListener('click',openSessionsDialog);
    document.getElementById('otpRequestForm').addEventListener('submit',requestOtp);
    document.getElementById('otpVerifyForm').addEventListener('submit',verifyOtp);
    document.getElementById('otpBackButton').addEventListener('click',resetOtpForm);
    document.getElementById('profileForm').addEventListener('submit',saveProfile);
    document.getElementById('profilePhoneCountry').addEventListener('change',updateWhatsAppPlaceholder);
    document.getElementById('campaignForm').addEventListener('submit',event=>saveCampaign(event,false));
    document.getElementById('saveAndSubmitCampaignButton').addEventListener('click',event=>saveCampaign(event,true));
    document.getElementById('generateContractButton').addEventListener('click',generateContract);
    document.getElementById('acceptContractButton').addEventListener('click',acceptContract);
    ['topSearchForm','mobileSearchForm'].forEach(id=>document.getElementById(id).addEventListener('submit',e=>{e.preventDefault();state.query=e.currentTarget.querySelector('input').value.trim();syncSearchInputs(state.query);navigate('home');renderOffers();document.getElementById('offersSection').scrollIntoView({behavior:'smooth'})}));
    ['topSearchInput','mobileSearchInput'].forEach(id=>document.getElementById(id).addEventListener('input',e=>{state.query=e.target.value.trim();syncSearchInputs(state.query);renderOffers()}));
    document.getElementById('exploreOffers').addEventListener('click',()=>document.getElementById('offersSection').scrollIntoView({behavior:'smooth'}));
    document.getElementById('howItWorksButton').addEventListener('click',()=>document.getElementById('howDialog').showModal());
    document.getElementById('offerDialog').querySelector('.dialog-close').addEventListener('click',()=>document.getElementById('offerDialog').close());
    document.getElementById('howDialog').querySelector('.dialog-close').addEventListener('click',()=>document.getElementById('howDialog').close());
    document.getElementById('scanDialog').querySelector('.dialog-close').addEventListener('click',()=>document.getElementById('scanDialog').close());
    document.getElementById('buyOfferButton').addEventListener('click',()=>{if(!state.auth&&!isStaticPreview()){document.getElementById('offerDialog').close();openAuthDialog();return}showToast('Compras próximamente','Esta oferta todavía no está disponible para compra.');});
    document.getElementById('newsletterForm').addEventListener('submit',event=>submitMarketingSubscription(event,'FOOTER'));
    document.getElementById('subscriberForm').addEventListener('submit',event=>submitMarketingSubscription(event,'WEB_MODAL'));
    document.getElementById('locationForm').addEventListener('submit',saveLocationSelection);
    document.getElementById('locationCountry').addEventListener('change',populateLocationCities);
    document.getElementById('suggestLocationButton').addEventListener('click',suggestNearestCity);
    window.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();navigate('home');document.getElementById('topSearchInput').focus()}});
  }
  function closeProfileMenu(){const menu=document.getElementById('profileMenu');menu.hidden=true;document.getElementById('profileSwitcher').setAttribute('aria-expanded','false')}
  function syncSearchInputs(value){document.getElementById('topSearchInput').value=value;document.getElementById('mobileSearchInput').value=value}
  function phoneFlag(iso){return String(iso||'').toUpperCase().replace(/[A-Z]/g,char=>String.fromCodePoint(127397+char.charCodeAt(0)))}
  function populatePhoneCountries(selectedIso){
    const select=document.getElementById('profilePhoneCountry');if(!select)return;const countries=Array.isArray(window.TAZMANY_PHONE_COUNTRIES)?window.TAZMANY_PHONE_COUNTRIES:[];
    select.innerHTML=countries.slice().sort((a,b)=>a.name.localeCompare(b.name,'es')).map(country=>`<option value="${escapeHtml(country.iso)}" data-dial="${escapeHtml(country.dial)}" title="${escapeHtml(country.name)}">${phoneFlag(country.iso)} +${escapeHtml(country.dial)}</option>`).join('');
    select.value=countries.some(country=>country.iso===selectedIso)?selectedIso:'PE';updateWhatsAppPlaceholder();
  }
  function updateWhatsAppPlaceholder(){const select=document.getElementById('profilePhoneCountry');const input=document.getElementById('profilePhoneNumber');if(!select||!input)return;input.placeholder=select.value==='PE'?'999 999 999':select.value==='ES'?'612 345 678':'Número de WhatsApp'}
  function buildWhatsAppE164(countryIso,nationalValue){
    const select=document.getElementById('profilePhoneCountry');const option=Array.from(select.options).find(item=>item.value===countryIso);const dial=option&&option.dataset.dial||'';let raw=String(nationalValue||'').trim();
    if(raw.startsWith('+'))return '+'+raw.replace(/\D/g,'');if(raw.startsWith('00'))return '+'+raw.slice(2).replace(/\D/g,'');let digits=raw.replace(/\D/g,'').replace(/^0/,'');return `+${dial}${digits}`;
  }
  function callServer(name,args,fallbackValue){
    if(hasRemoteApi())return callRemoteApi(name,args).then(response=>response&&response.ok?response.data:Promise.reject(response&&response.error||{code:'UNKNOWN_ERROR',message:'No pudimos completar la solicitud.'}));
    return new Promise(resolve=>{if(!(window.google&&google.script&&google.script.run)){resolve(fallbackValue);return}const runner=google.script.run.withSuccessHandler(response=>resolve(response&&response.ok?response.data:fallbackValue)).withFailureHandler(()=>resolve(fallbackValue));runner[name](...(args||[]))});
  }
  function callServerStrict(name,args){
    if(hasRemoteApi())return callRemoteApi(name,args).then(response=>response&&response.ok?response.data:Promise.reject(response&&response.error||{code:'UNKNOWN_ERROR',message:'No pudimos completar la solicitud.'}));
    return new Promise((resolve,reject)=>{if(!(window.google&&google.script&&google.script.run)){reject({code:'SERVICE_NOT_AVAILABLE',message:'No pudimos conectar con el servicio.'});return}const runner=google.script.run.withSuccessHandler(response=>response&&response.ok?resolve(response.data):reject(response&&response.error||{code:'UNKNOWN_ERROR',message:'No pudimos completar la solicitud.'})).withFailureHandler(error=>reject({code:'SERVER_ERROR',message:error&&error.message||'No pudimos conectar con el servidor.'}));runner[name](...(args||[]))});
  }
  function hasAppsScriptBridge(){return Boolean(window.google&&google.script&&google.script.run)}
  function hasRemoteApi(){return Boolean(window.TAZMANY_CONFIG&&/^https:\/\//.test(String(window.TAZMANY_CONFIG.apiBaseUrl||'')))}
  async function callRemoteApi(name,args){
    const endpoint=`${String(window.TAZMANY_CONFIG.apiBaseUrl).replace(/\/+$/,'')}/api`;let response;
    try{response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:name,args:args||[]}),cache:'no-store',credentials:'omit'})}catch(error){throw{code:'NETWORK_ERROR',message:'No pudimos conectar con Tazmany. Revisa tu conexión.'}}
    let payload;try{payload=await response.json()}catch(error){throw{code:'INVALID_SERVER_RESPONSE',message:'El servidor devolvió una respuesta inválida.'}}
    if(!response.ok)throw payload&&payload.error||{code:'SERVER_ERROR',message:'No pudimos completar la solicitud.'};return payload;
  }
  function publicCacheKey(cityId){return `tazmany_public_catalog_v1:${cityId||'all'}`}
  function hydrateCachedPublicData(){try{const cityId=state.location&&state.location.cityId||'';const stored=JSON.parse(localStorage.getItem(publicCacheKey(cityId))||'null');if(!stored||!stored.data||Date.now()-Number(stored.savedAt||0)>PUBLIC_CACHE_TTL_MS)return false;state.publicData=stored.data;state.publicCacheRendered=true;const remoteUrl=window.TAZMANY_CONFIG&&window.TAZMANY_CONFIG.apiBaseUrl||'';if(state.publicData.config)window.TAZMANY_CONFIG=Object.assign({},window.TAZMANY_CONFIG,state.publicData.config,{apiBaseUrl:remoteUrl,isStaticPreview:!remoteUrl&&!hasAppsScriptBridge()});syncLocationLabels();renderClubPlan();renderCategories();renderOffers();renderMerchants();return true}catch(error){return false}}
  function cachePublicData(cityId,data){try{localStorage.setItem(publicCacheKey(cityId),JSON.stringify({savedAt:Date.now(),data}))}catch(error){}}
  async function loadPublicData(options={}){
    const cityId=state.location&&state.location.cityId||'';const remoteUrl=window.TAZMANY_CONFIG&&window.TAZMANY_CONFIG.apiBaseUrl||'';
    try{state.publicData=await callServer('apiGetPublicBootstrap',cityId?[cityId]:[],filterFallbackByCity(fallback,cityId));state.backendAvailable=true;state.publicCacheRendered=false;cachePublicData(cityId,state.publicData)}
    catch(error){state.backendAvailable=false;if(!state.publicData)state.publicData={countries:fallback.countries,cities:fallback.cities,categories:[],offers:[],featuredMerchants:[],selectedCityId:cityId||'city-lima'};if(!options.silent)showToast('Servicio temporalmente no disponible','No pudimos actualizar las ofertas. Inténtalo nuevamente en unos minutos.')}
    if(state.publicData&&state.publicData.config)window.TAZMANY_CONFIG=Object.assign({},window.TAZMANY_CONFIG,state.publicData.config,{apiBaseUrl:remoteUrl,isStaticPreview:!remoteUrl&&!hasAppsScriptBridge()});
    syncLocationLabels();renderClubPlan();renderCategories();renderOffers();renderMerchants();
  }
  function renderClubPlan(){
    const plan=state.publicData&&state.publicData.clubPlan||fallback.clubPlan;if(!plan)return;
    const intro=money(plan.introPriceCents||490);const regular=money(plan.regularPriceCents||990);
    setText('clubIntroPrice',intro);setText('clubRenewalPrice',`Desde el segundo mes: ${regular} al mes`);setText('clubBannerIntroPrice',intro);setText('clubBannerCopy','Tu primer mes con precios exclusivos y 3% de cashback.');setText('clubBannerRenewal',`Desde el segundo mes pagarás ${regular} al mes. Podrás cancelar cuando quieras.`);
  }
  function readStoredLocation(){try{return JSON.parse(localStorage.getItem('tazmany_location')||'null')}catch(error){return null}}
  function filterFallbackByCity(data,cityId){if(!cityId)return data;return Object.assign({},data,{offers:data.offers.filter(offer=>(offer.cityId||'city-lima')===cityId),selectedCityId:cityId})}
  function currentCity(){const cities=state.publicData&&state.publicData.cities||fallback.cities;return cities.find(city=>city.id===(state.location&&state.location.cityId))||cities[0]}
  function syncLocationLabels(){const city=currentCity();const name=city&&city.name||'Lima';document.querySelectorAll('[data-selected-city]').forEach(node=>node.textContent=name);const desktop=document.getElementById('selectedCityLabel');if(desktop)desktop.textContent=name}
  function initDiscoveryExperience(){populateLocationDialog();syncLocationLabels();if(!state.location&&state.view==='home')setTimeout(()=>document.getElementById('locationDialog').showModal(),250);else if(state.view==='home')scheduleSubscriberDialog()}
  function openLocationDialog(){populateLocationDialog();document.getElementById('locationDialog').showModal()}
  function populateLocationDialog(){const data=state.publicData||fallback;const country=document.getElementById('locationCountry');const countries=data.countries||[{code:'PE',name:'Perú'}];country.innerHTML=countries.map(item=>`<option value="${escapeHtml(item.code)}">${escapeHtml(item.name)}</option>`).join('');country.value=state.location&&state.location.countryCode||'PE';populateLocationCities()}
  function populateLocationCities(){const data=state.publicData||fallback;const countryCode=document.getElementById('locationCountry').value||'PE';const cities=(data.cities||[]).filter(city=>(city.countryCode||'PE')===countryCode);const select=document.getElementById('locationCity');select.innerHTML=cities.map(city=>`<option value="${escapeHtml(city.id)}">${escapeHtml(city.name)}${city.id==='city-lima'?' · ofertas disponibles':' · próximamente'}</option>`).join('');if(state.location&&cities.some(city=>city.id===state.location.cityId))select.value=state.location.cityId}
  async function saveLocationSelection(event){event.preventDefault();const form=event.currentTarget;const location={countryCode:form.countryCode.value,cityId:form.cityId.value};localStorage.setItem('tazmany_location',JSON.stringify(location));state.location=location;document.getElementById('locationDialog').close();await loadPublicData();showToast('Ciudad actualizada',`Ahora exploras ${currentCity().name}.`);scheduleSubscriberDialog()}
  function suggestNearestCity(){const status=document.getElementById('locationStatus');if(!navigator.geolocation){status.textContent='Tu navegador no permite sugerir una ubicación.';return}status.textContent='Buscando la ciudad más cercana…';navigator.geolocation.getCurrentPosition(position=>{const cities=(state.publicData&&state.publicData.cities||fallback.cities).filter(city=>Number.isFinite(Number(city.latitude))&&Number.isFinite(Number(city.longitude)));if(!cities.length){status.textContent='No hay coordenadas de ciudades configuradas.';return}const lat=position.coords.latitude,lng=position.coords.longitude;const nearest=cities.reduce((best,city)=>{const distance=Math.pow(lat-Number(city.latitude),2)+Math.pow(lng-Number(city.longitude),2);return !best||distance<best.distance?{city,distance}:best},null).city;document.getElementById('locationCountry').value=nearest.countryCode||'PE';populateLocationCities();document.getElementById('locationCity').value=nearest.id;status.textContent=`Sugerencia: ${nearest.name}. Confirma para aplicarla.`},()=>{status.textContent='No pudimos obtener tu ubicación. Puedes elegir la ciudad manualmente.'},{timeout:8000,maximumAge:600000})}
  function scheduleSubscriberDialog(){if(localStorage.getItem('tazmany_marketing_subscribed'))return;const dismissed=Number(localStorage.getItem('tazmany_subscriber_dismissed_at')||0);if(Date.now()-dismissed<14*24*60*60*1000)return;setTimeout(()=>{const dialog=document.getElementById('subscriberDialog');if(!document.querySelector('dialog[open]'))dialog.showModal()},1200)}
  function rememberSubscriberDismissal(){localStorage.setItem('tazmany_subscriber_dismissed_at',String(Date.now()))}
  async function submitMarketingSubscription(event,source){event.preventDefault();const form=event.currentTarget;const email=form.querySelector('[type="email"]').value.trim();const consent=form.querySelector('[name="marketingConsent"]').checked;const city=currentCity();const status=form.querySelector('.form-status');const button=form.querySelector('[type="submit"]');button.disabled=true;status.textContent='Guardando tu preferencia…';status.classList.remove('error');try{if(isStaticPreview()){status.textContent='No pudimos conectar con el servicio.';status.classList.add('error');return}const payload={email,marketingConsent:consent,countryCode:city.countryCode||'PE',cityId:city.id,source,consentVersion:'marketing-2026-08-25'};await callServerStrict('apiSubscribeToOffers',[payload,newIdempotencyKey('marketing-subscribe')]);localStorage.setItem('tazmany_marketing_subscribed','1');status.textContent='Suscripción confirmada.';form.reset();showToast('Ya estás en la lista',`Te mostraremos novedades de ${city.name}.`);if(form.id==='subscriberForm')setTimeout(()=>document.getElementById('subscriberDialog').close(),700)}catch(error){status.textContent=error.message||'No pudimos guardar tu suscripción.';status.classList.add('error')}finally{button.disabled=false}}
  function navigate(view,push=true){
    if(!['home','customer','merchant','admin'].includes(view))view='home';state.view=view;
    if(view!=='home'&&!state.auth){openAuthDialog();view='home';state.view='home'}
    /* Cualquier cliente autenticado puede abrir Comercio para iniciar su expediente.
       Los permisos de propietario se conceden al crear el borrador. */
    if(view==='admin'&&state.auth&&!hasClientPermission('admin.dashboard.read')&&!hasClientPermission('*')){showToast('Acceso restringido','Tu cuenta no tiene permisos administrativos.');view='home';state.view='home'}
    document.querySelectorAll('.view').forEach(section=>section.hidden=section.dataset.view!==view);
    document.querySelectorAll('.mobile-nav [data-route]').forEach(button=>button.classList.toggle('active',button.dataset.route===view));
    updateAuthUi();
    document.getElementById('categoryStrip').hidden=view!=='home';document.querySelector('.site-footer').hidden=view!=='home';
    if(view==='customer')loadCustomer();if(view==='merchant')loadMerchant();if(view==='admin')loadAdmin();
    if(push&&history.pushState)history.pushState({view},'',`${location.pathname}?view=${view}`);window.scrollTo({top:0,behavior:'smooth'});document.getElementById('mainContent').focus({preventScroll:true});
  }
  window.addEventListener('popstate',e=>navigate((e.state&&e.state.view)||new URLSearchParams(location.search).get('view')||'home',false));
