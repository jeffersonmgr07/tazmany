<script>
(function () {
  'use strict';

  const ICONS = {
    pin:'<path d="M12 21s6-5 6-11a6 6 0 1 0-12 0c0 6 6 11 6 11Z"/><circle cx="12" cy="10" r="2"/>',chevron:'<path d="m8 10 4 4 4-4"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.7-7.5a5.5 5.5 0 0 0 1.1-8.9Z"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',store:'<path d="M3 9h18l-2-5H5L3 9Z"/><path d="M5 9v11h14V9M9 20v-6h6v6"/>',compass:'<circle cx="12" cy="12" r="9"/><path d="m15 9-2 4-4 2 2-4 4-2Z"/>',arrow:'<path d="M5 12h14m-5-5 5 5-5 5"/>',shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/>',verified:'<path d="M20 7 9 18l-5-5"/>',coupon:'<path d="M4 5h16v5a2 2 0 0 0 0 4v5H4v-5a2 2 0 0 0 0-4V5Z"/><path d="M12 7v2m0 3v2m0 3v1"/>',wallet:'<path d="M3 6h16v14H3z"/><path d="M3 8V4h13v4m2 4h3v4h-3"/>',card:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/>',celebrate:'<path d="m4 20 4-12 8 8-12 4Z"/><path d="M14 4h.01M19 9h.01M18 3l-2 2M21 6l-2 1M12 2l-1 2"/>',home:'<path d="m3 11 9-8 9 8v10h-6v-6H9v6H3V11Z"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>',grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',receipt:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Z"/><path d="M9 8h6m-6 4h6"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',support:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-1 .4-1 1.2-1 2.2M12 17h.01"/>',sparkle:'<path d="m12 3 1.5 5.5L19 10l-5.5 1.5L12 17l-1.5-5.5L5 10l5.5-1.5L12 3Z"/>',scan:'<path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4M8 12h8"/>',campaign:'<path d="m3 11 14-6v14L3 13v-2Z"/><path d="m7 14 1 6h4l-1-5"/>',star:'<path d="m12 2 3 6 7 .9-5 4.8 1.2 6.8L12 17l-6.2 3.5L7 13.7 2 8.9 9 8l3-6Z"/>',branch:'<path d="M5 21V7l7-4 7 4v14M3 21h18M9 10h6m-6 4h6m-6 4h6"/>',users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3A1.7 1.7 0 0 0 10 3V2.8h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M5 21h14"/>',trend:'<path d="m3 17 6-6 4 4 8-9"/><path d="M15 6h6v6"/>'
  };
  const categoryGlyphs = {restaurant:'🍽️',sparkles:'✨',fitness:'🏋️',car:'🚗',ticket:'🎟️'};
  const money = cents => new Intl.NumberFormat('es-PE',{style:'currency',currency:'PEN',minimumFractionDigits:2}).format(Number(cents||0));
  const date = value => value ? new Intl.DateTimeFormat('es-PE',{day:'2-digit',month:'short',year:'numeric',timeZone:'America/Lima'}).format(new Date(value)) : '';
  const escapeHtml = value => String(value??'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));

  const state = { view:'home', publicData:null, query:'', categoryId:'', favorites:new Set(), customerLoaded:false, merchantLoaded:false, auth:null, otpChallenge:null, googleNonce:'' };
  const fallback = createFallbackData();

  document.addEventListener('DOMContentLoaded', init);
  async function init(){
    applyLogo(); hydrateIcons(document); bindGlobalEvents(); loadPublicData(); await restoreSession(); initGoogleIdentity(); navigate(window.TAZMANY_INITIAL_VIEW || 'home', false);
  }
  function applyLogo(){
    const url=window.TAZMANY_CONFIG&&window.TAZMANY_CONFIG.logoUrl;
    if(!url)return;const img=document.getElementById('brandLogo');img.src=url;img.onload=()=>{img.hidden=false;document.getElementById('brandFallback').hidden=true};img.onerror=()=>{img.hidden=true};
  }
  function hydrateIcons(root){
    root.querySelectorAll('[data-icon]:not([data-icon-ready])').forEach(el=>{const name=el.dataset.icon;el.innerHTML=`<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]||ICONS.sparkle}</svg>`;el.dataset.iconReady='1'});
  }
  function bindGlobalEvents(){
    document.addEventListener('click',event=>{
      const route=event.target.closest('[data-route]');if(route){navigate(route.dataset.route);closeProfileMenu();return}
      if(event.target.closest('[data-clear-filter]')){state.query='';state.categoryId='';syncSearchInputs('');renderCategories();renderOffers();return}
      if(event.target.closest('[data-focus-search]')){navigate('home');setTimeout(()=>document.getElementById('mobileSearchInput').focus(),80);return}
      if(event.target.closest('[data-close-dialog]'))event.target.closest('dialog')?.close();
      if(!event.target.closest('#profileSwitcher')&&!event.target.closest('#profileMenu'))closeProfileMenu();
    });
    document.getElementById('profileSwitcher').addEventListener('click',()=>{if(!state.auth&&!isStaticPreview()){openAuthDialog();return}const menu=document.getElementById('profileMenu');menu.hidden=!menu.hidden;document.getElementById('profileSwitcher').setAttribute('aria-expanded',String(!menu.hidden))});
    document.getElementById('loginMenuButton').addEventListener('click',openAuthDialog);
    document.getElementById('logoutMenuButton').addEventListener('click',logout);
    document.getElementById('sessionsMenuButton').addEventListener('click',openSessionsDialog);
    document.getElementById('otpRequestForm').addEventListener('submit',requestOtp);
    document.getElementById('otpVerifyForm').addEventListener('submit',verifyOtp);
    document.getElementById('otpBackButton').addEventListener('click',resetOtpForm);
    document.getElementById('profileForm').addEventListener('submit',saveProfile);
    ['topSearchForm','mobileSearchForm'].forEach(id=>document.getElementById(id).addEventListener('submit',e=>{e.preventDefault();state.query=e.currentTarget.querySelector('input').value.trim();syncSearchInputs(state.query);navigate('home');renderOffers();document.getElementById('offersSection').scrollIntoView({behavior:'smooth'})}));
    ['topSearchInput','mobileSearchInput'].forEach(id=>document.getElementById(id).addEventListener('input',e=>{state.query=e.target.value.trim();syncSearchInputs(state.query);renderOffers()}));
    document.getElementById('exploreOffers').addEventListener('click',()=>document.getElementById('offersSection').scrollIntoView({behavior:'smooth'}));
    document.getElementById('howItWorksButton').addEventListener('click',()=>document.getElementById('howDialog').showModal());
    document.getElementById('offerDialog').querySelector('.dialog-close').addEventListener('click',()=>document.getElementById('offerDialog').close());
    document.getElementById('howDialog').querySelector('.dialog-close').addEventListener('click',()=>document.getElementById('howDialog').close());
    document.getElementById('scanDialog').querySelector('.dialog-close').addEventListener('click',()=>document.getElementById('scanDialog').close());
    document.getElementById('demoBuyButton').addEventListener('click',()=>{if(!state.auth&&!isStaticPreview()){document.getElementById('offerDialog').close();openAuthDialog();return}showToast('Checkout reservado para Fase 4','No se realizó ningún cobro.');});
    document.getElementById('newsletterForm').addEventListener('submit',e=>{e.preventDefault();showToast('¡Gracias por tu interés!','La suscripción se conectará en una fase posterior.');e.currentTarget.reset()});
    window.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();navigate('home');document.getElementById('topSearchInput').focus()}});
  }
  function closeProfileMenu(){const menu=document.getElementById('profileMenu');menu.hidden=true;document.getElementById('profileSwitcher').setAttribute('aria-expanded','false')}
  function syncSearchInputs(value){document.getElementById('topSearchInput').value=value;document.getElementById('mobileSearchInput').value=value}
  function callServer(name,args,fallbackValue){
    return new Promise(resolve=>{if(!(window.google&&google.script&&google.script.run)){resolve(fallbackValue);return}const runner=google.script.run.withSuccessHandler(response=>resolve(response&&response.ok?response.data:fallbackValue)).withFailureHandler(()=>resolve(fallbackValue));runner[name](...(args||[]))});
  }
  function callServerStrict(name,args){
    return new Promise((resolve,reject)=>{if(!(window.google&&google.script&&google.script.run)){reject({code:'STATIC_PREVIEW',message:'Esta acción funciona en la Web App de Apps Script.'});return}const runner=google.script.run.withSuccessHandler(response=>response&&response.ok?resolve(response.data):reject(response&&response.error||{code:'UNKNOWN_ERROR',message:'No pudimos completar la solicitud.'})).withFailureHandler(error=>reject({code:'SERVER_ERROR',message:error&&error.message||'No pudimos conectar con el servidor.'}));runner[name](...(args||[]))});
  }
  async function loadPublicData(){state.publicData=await callServer('apiGetPublicBootstrap',[],fallback);renderCategories();renderOffers();renderMerchants()}
  function navigate(view,push=true){
    if(!['home','customer','merchant','admin'].includes(view))view='home';state.view=view;
    if(view!=='home'&&!state.auth&&!isStaticPreview()){openAuthDialog();view='home';state.view='home'}
    if(view==='merchant'&&state.auth&&!hasClientPermission('merchant.dashboard.read')){showToast('Acceso restringido','Esta cuenta no está vinculada a un comercio.');view='home';state.view='home'}
    if(view==='admin'&&state.auth&&!hasClientPermission('admin.dashboard.read')&&!hasClientPermission('*')){showToast('Acceso restringido','Tu cuenta no tiene permisos administrativos.');view='home';state.view='home'}
    document.querySelectorAll('.view').forEach(section=>section.hidden=section.dataset.view!==view);
    document.querySelectorAll('.mobile-nav [data-route]').forEach(button=>button.classList.toggle('active',button.dataset.route===view));
    updateAuthUi();
    document.getElementById('categoryStrip').hidden=view!=='home';document.querySelector('.site-footer').hidden=view!=='home';
    if(view==='customer')loadCustomer();if(view==='merchant')loadMerchant();if(view==='admin')renderAdmin();
    if(push&&history.pushState)history.pushState({view},'',`${location.pathname}?view=${view}`);window.scrollTo({top:0,behavior:'smooth'});document.getElementById('mainContent').focus({preventScroll:true});
  }
  window.addEventListener('popstate',e=>navigate((e.state&&e.state.view)||new URLSearchParams(location.search).get('view')||'home',false));
  function renderCategories(){
    if(!state.publicData)return;const strip=document.getElementById('categoryStrip');strip.innerHTML='<div class="container"></div>';const box=strip.firstElementChild;
    const all=make('button','category-chip'+(!state.categoryId?' active':''),'<span class="chip-glyph">✦</span> Todas');all.type='button';all.onclick=()=>{state.categoryId='';renderCategories();renderOffers()};box.append(all);
    state.publicData.categories.forEach(category=>{const button=make('button','category-chip'+(state.categoryId===category.id?' active':''),`<span class="chip-glyph">${categoryGlyphs[category.icon]||'✦'}</span> ${escapeHtml(category.name)}`);button.type='button';button.onclick=()=>{state.categoryId=category.id;renderCategories();renderOffers();document.getElementById('offersSection').scrollIntoView({behavior:'smooth'})};box.append(button)});
  }
  function renderOffers(){
    if(!state.publicData)return;const query=normalize(state.query);const offers=state.publicData.offers.filter(offer=>(!state.categoryId||offer.categoryId===state.categoryId)&&(!query||normalize(`${offer.title} ${offer.merchantName} ${offer.categoryName} ${offer.districtLabel}`).includes(query)));const grid=document.getElementById('offerGrid');grid.innerHTML='';
    offers.forEach(offer=>grid.append(createOfferCard(offer)));document.getElementById('offersEmpty').hidden=offers.length>0;grid.hidden=offers.length===0;
    const summary=document.getElementById('filterSummary');summary.hidden=!state.query&&!state.categoryId;document.getElementById('filterSummaryText').textContent=`${offers.length} resultado${offers.length===1?'':'s'}${state.query?` para “${state.query}”`:''}`;
  }
  function createOfferCard(offer){
    const card=document.getElementById('offerCardTemplate').content.firstElementChild.cloneNode(true);card.dataset.offerId=offer.id;const img=card.querySelector('.offer-image');img.src=offer.imageUrl;img.alt=offer.title;img.onerror=()=>img.hidden=true;card.querySelector('.discount-badge').textContent=`-${offer.discountPercent}%`;
    const stock=card.querySelector('.stock-badge');if(offer.lowStock){stock.hidden=false;stock.textContent=`Solo ${offer.remainingStock} disponibles`}
    card.querySelector('.offer-category').textContent=offer.categoryName;card.querySelector('.rating b').textContent=offer.rating.toFixed(1);card.querySelector('.rating small').textContent=`(${offer.reviewCount})`;card.querySelector('.offer-title').textContent=offer.title;card.querySelector('.offer-merchant').textContent=offer.merchantName;card.querySelector('.offer-location span:last-child').textContent=offer.districtLabel;
    card.querySelector('.offer-tags').innerHTML=offer.tags.slice(0,2).map(tag=>`<span class="offer-tag">${escapeHtml(tag)}</span>`).join('');card.querySelector('.normal-price').textContent=`Antes ${money(offer.normalPriceCents)}`;card.querySelector('.offer-price').textContent=money(offer.offerPriceCents);card.querySelector('.cashback-pill').textContent=`+${offer.cashbackPercent}% cashback`;
    card.querySelectorAll('[data-offer-action]').forEach(button=>button.onclick=()=>openOffer(offer.id));const favorite=card.querySelector('.favorite-button');favorite.classList.toggle('active',state.favorites.has(offer.id));favorite.onclick=()=>{state.favorites.has(offer.id)?state.favorites.delete(offer.id):state.favorites.add(offer.id);favorite.classList.toggle('active');showToast(favorite.classList.contains('active')?'Guardada en favoritos':'Eliminada de favoritos',offer.title)};hydrateIcons(card);return card;
  }
  async function openOffer(id){
    const base=state.publicData.offers.find(item=>item.id===id);const local=Object.assign({},base,{description:base.summary,includes:['Experiencia indicada en la oferta'],restrictions:['Consulta disponibilidad antes de asistir'],branches:[{name:base.districtLabel,address:'Dirección visible tras confirmar'}]});const offer=await callServer('apiGetOfferDetails',[id],local);const dialog=document.getElementById('offerDialog');
    setText('offerDialogTitle',offer.title);setText('dialogCategory',offer.categoryName);setText('dialogMerchant',`${offer.merchantName} · ${offer.districtLabel}`);setText('dialogRating',`★ ${Number(offer.rating).toFixed(1)} · ${offer.reviewCount} reseñas verificadas`);setText('dialogDescription',offer.description||offer.summary);setText('dialogNormalPrice',money(offer.normalPriceCents));setText('dialogOfferPrice',money(offer.offerPriceCents));setText('dialogCashback',`+${offer.cashbackPercent}%`);setText('dialogDiscount',`Ahorras ${offer.discountPercent}%`);const img=document.getElementById('dialogImage');img.hidden=false;img.src=offer.imageUrl;img.alt=offer.title;img.onerror=()=>img.hidden=true;
    document.getElementById('dialogIncludes').innerHTML=(offer.includes||[]).map(item=>`<li>${escapeHtml(item)}</li>`).join('');document.getElementById('dialogRestrictions').innerHTML=(offer.restrictions||[]).map(item=>`<li>${escapeHtml(item)}</li>`).join('');document.getElementById('dialogBranches').innerHTML=(offer.branches||[]).map(branch=>`<span class="branch-pill">📍 ${escapeHtml(branch.name)} · ${escapeHtml(branch.address||'')}</span>`).join('');dialog.showModal();
  }
  function renderMerchants(){const box=document.getElementById('featuredMerchants');box.innerHTML='';state.publicData.featuredMerchants.forEach(merchant=>{const initials=merchant.name.split(' ').map(x=>x[0]).slice(0,2).join('');box.insertAdjacentHTML('beforeend',`<article class="merchant-card"><span>${escapeHtml(initials)}</span><h3>${escapeHtml(merchant.name)}</h3><p>${escapeHtml(merchant.description)}</p><b>★ ${Number(merchant.rating).toFixed(1)}</b></article>`)})}
  async function loadCustomer(){
    const target=document.getElementById('customerView');if(!state.customerLoaded){target.innerHTML='<div class="loading-panel"><div><div class="loading-spinner"></div>Cargando tu espacio…</div></div>';try{const data=isStaticPreview()?fallback.customer:await callServerStrict('apiGetCustomerDashboard',[sessionToken()]);renderCustomer(data);state.customerLoaded=true}catch(error){handleProtectedError(error,target)}}
  }
  function renderCustomer(data){
    const target=document.getElementById('customerView');target.innerHTML='';target.append(document.getElementById('customerDashboardTemplate').content.cloneNode(true));target.querySelector('[data-customer-name]').textContent=data.profile.name;target.querySelector('[data-customer-first-name]').textContent=data.profile.name.split(' ')[0];target.querySelector('[data-customer-initials]').textContent=data.profile.initials;
    Object.entries(data.summary).forEach(([key,value])=>{const plain=target.querySelector(`[data-stat="${key}"]`);const cash=target.querySelector(`[data-stat-money="${key}"]`);if(plain)plain.textContent=value;if(cash)cash.textContent=money(value)});target.querySelector('[data-available-count]').textContent=data.summary.availableCoupons;
    const list=target.querySelector('[data-coupon-list]');const statusLabels={AVAILABLE:`Disponible · vence`,REDEEMED:'Cupón utilizado',EXPIRED:'Cupón vencido',REFUNDED:'Compra reembolsada'};data.coupons.forEach(coupon=>{const statusText=coupon.status==='AVAILABLE'?`${statusLabels.AVAILABLE} ${date(coupon.expiresAt)}`:(statusLabels[coupon.status]||coupon.status);list.insertAdjacentHTML('beforeend',`<article class="coupon-row ${coupon.status!=='AVAILABLE'?'used':''}"><img src="${escapeHtml(coupon.imageUrl)}" alt=""><div><strong>${escapeHtml(coupon.title)}</strong><p>${escapeHtml(coupon.merchantName)} · ${escapeHtml(coupon.code)}</p><small>${escapeHtml(statusText)}</small></div><button type="button">${coupon.status==='AVAILABLE'?'Ver cupón':'Ver detalle'}</button></article>`)});
    const activity=target.querySelector('[data-activity-list]');data.activity.forEach(item=>activity.insertAdjacentHTML('beforeend',`<article class="activity-row"><span><i class="icon" data-icon="${item.amountCents?'wallet':'verified'}"></i></span><div><strong>${escapeHtml(item.label)}</strong><small>${escapeHtml(item.detail)} · ${escapeHtml(item.dateLabel)}</small></div><b>${item.amountCents?'+'+money(item.amountCents):''}</b></article>`));hydrateIcons(target);target.querySelectorAll('[data-route]').forEach(button=>button.onclick=()=>navigate(button.dataset.route));target.querySelectorAll('.coupon-row button').forEach(button=>button.onclick=()=>showToast('Vista de cupón','El QR seguro se implementará en la Fase 4.'));
  }
  async function loadMerchant(){
    const target=document.getElementById('merchantView');if(!state.merchantLoaded){target.innerHTML='<div class="loading-panel"><div><div class="loading-spinner"></div>Cargando panel del comercio…</div></div>';try{const data=isStaticPreview()?fallback.merchant:await callServerStrict('apiGetMerchantDashboard',[sessionToken()]);renderMerchant(data);state.merchantLoaded=true}catch(error){handleProtectedError(error,target)}}
  }
  function renderMerchant(data){
    const target=document.getElementById('merchantView');target.innerHTML='';target.append(document.getElementById('merchantDashboardTemplate').content.cloneNode(true));target.querySelector('[data-merchant-name]').textContent=data.merchant.name;target.querySelector('[data-merchant-initials]').textContent=data.merchant.initials;Object.entries(data.summary).forEach(([key,value])=>{const plain=target.querySelector(`[data-stat="${key}"]`);const cash=target.querySelector(`[data-stat-money="${key}"]`);if(plain)plain.textContent=value;if(cash)cash.textContent=money(value)});
    const max=Math.max(...data.weeklySales);target.querySelector('[data-sales-chart]').innerHTML=data.weeklySales.map(value=>`<span class="sales-bar-wrap"><i class="sales-bar" style="height:${Math.max(8,value/max*100)}%" data-value="${money(value*1000)}"></i></span>`).join('');target.querySelector('[data-redemption-list]').innerHTML=data.recentRedemptions.map(item=>`<article class="redemption-row"><span><i class="icon" data-icon="verified"></i></span><div><strong>${escapeHtml(item.offer)}</strong><p>${escapeHtml(item.code)} · ${escapeHtml(item.branch)}</p></div><small>${escapeHtml(item.time)}</small></article>`).join('');
    target.querySelector('[data-campaign-table]').innerHTML=data.campaigns.map(campaign=>`<tr><td><div class="campaign-name"><img src="${escapeHtml(campaign.imageUrl)}" alt=""><strong>${escapeHtml(campaign.title)}</strong></div></td><td><span class="status-pill ${campaign.status.toLowerCase()}">${escapeHtml(campaign.status)}</span></td><td>${campaign.sold}</td><td>${campaign.sold}/${campaign.inventory}<div class="stock-progress"><i style="width:${Math.min(100,campaign.sold/campaign.inventory*100)}%"></i></div></td><td><strong>${money(campaign.revenueCents)}</strong></td><td><button class="table-menu" type="button">•••</button></td></tr>`).join('');hydrateIcons(target);target.querySelector('#scanCouponButton').onclick=()=>document.getElementById('scanDialog').showModal();target.querySelectorAll('.dashboard-nav button,.table-menu,.campaign-panel .button').forEach(button=>button.onclick=()=>showToast('Módulo preparado','Se conectará a reglas y permisos en su fase correspondiente.'));
  }
  function renderAdmin(){const target=document.getElementById('adminView');if(target.childElementCount)return;target.append(document.getElementById('adminDashboardTemplate').content.cloneNode(true));hydrateIcons(target);target.querySelector('[data-route]').onclick=()=>navigate('home')}
  function isStaticPreview(){return Boolean(window.TAZMANY_CONFIG&&window.TAZMANY_CONFIG.isStaticPreview)}
  function sessionToken(){return localStorage.getItem('tazmany_session_token')||''}
  function newIdempotencyKey(scope){const id=window.crypto&&crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(36).slice(2)}`;return `web:${scope}:${id}`}
  function deviceLabel(){const mobile=/Mobi|Android/i.test(navigator.userAgent);return `${mobile?'Móvil':'Computadora'} · ${navigator.platform||'Navegador'}`.slice(0,80)}
  function hasClientPermission(permission){const permissions=state.auth&&state.auth.user&&state.auth.user.permissions||[];return permissions.some(item=>item==='*'||item===permission||(item.endsWith('.*')&&permission.startsWith(item.slice(0,-1))))}
  async function restoreSession(){
    const token=sessionToken();if(!token||isStaticPreview()){updateAuthUi();return}
    try{state.auth=await callServerStrict('apiGetSession',[token])}catch(error){localStorage.removeItem('tazmany_session_token');state.auth=null}updateAuthUi();
  }
  function acceptAuth(auth){state.auth=auth;localStorage.setItem('tazmany_session_token',auth.sessionToken);state.customerLoaded=false;state.merchantLoaded=false;updateAuthUi();document.getElementById('authDialog').close();showToast('Sesión iniciada',`Hola, ${auth.user.displayName||'bienvenido a Tazmany'}.`);if(auth.needsProfile)setTimeout(openProfileDialog,180)}
  function updateAuthUi(){
    const user=state.auth&&state.auth.user;const label=document.getElementById('profileLabel');const note=document.getElementById('authStateLabel');const avatar=document.getElementById('headerAvatar');
    if(user){label.textContent=(user.displayName||user.email).split(' ')[0];note.textContent='Sesión protegida';avatar.textContent=(user.displayName||user.email).split(/\s|@/).map(x=>x[0]).slice(0,2).join('').toUpperCase();document.getElementById('loginMenuButton').hidden=true;document.getElementById('logoutMenuButton').hidden=false;document.getElementById('sessionsMenuButton').hidden=false}
    else{label.textContent=isStaticPreview()?'Vista previa':'Ingresar';note.textContent=isStaticPreview()?'GitHub Pages':'Tu cuenta';avatar.textContent='T';document.getElementById('loginMenuButton').hidden=false;document.getElementById('logoutMenuButton').hidden=true;document.getElementById('sessionsMenuButton').hidden=true}
  }
  function openAuthDialog(){closeProfileMenu();resetOtpForm();const message=document.getElementById('googleAuthMessage');if(isStaticPreview()){message.hidden=false;message.textContent='La vista de GitHub Pages es visual. El acceso real funciona en la Web App de Apps Script.'}document.getElementById('authDialog').showModal();initGoogleIdentity()}
  function resetOtpForm(){state.otpChallenge=null;document.getElementById('otpRequestForm').hidden=false;document.getElementById('otpVerifyForm').hidden=true;setStatus('authStatus','',false)}
  function setStatus(id,message,isError){const box=document.getElementById(id);box.textContent=message||'';box.hidden=!message;box.classList.toggle('error',Boolean(isError))}
  function setFormBusy(form,busy){form.querySelectorAll('button,input,select').forEach(control=>control.disabled=busy)}
  async function requestOtp(event){
    event.preventDefault();const form=event.currentTarget;const email=form.email.value.trim();setFormBusy(form,true);setStatus('authStatus','Enviando tu código…',false);
    try{const result=await callServerStrict('apiRequestEmailOtp',[email,deviceLabel(),newIdempotencyKey('otp-request')]);state.otpChallenge={email,challengeId:result.challengeId};document.getElementById('otpEmailMasked').textContent=result.emailMasked;form.hidden=true;document.getElementById('otpVerifyForm').hidden=false;document.getElementById('otpCode').focus();setStatus('authStatus','Código enviado. Revisa también tu carpeta de spam.',false)}catch(error){setStatus('authStatus',error.message||'No pudimos enviar el código.',true)}finally{setFormBusy(form,false)}
  }
  async function verifyOtp(event){
    event.preventDefault();const form=event.currentTarget;if(!state.otpChallenge)return resetOtpForm();setFormBusy(form,true);setStatus('authStatus','Confirmando el código…',false);
    try{const auth=await callServerStrict('apiVerifyEmailOtp',[state.otpChallenge.email,state.otpChallenge.challengeId,form.code.value,deviceLabel(),newIdempotencyKey('otp-verify')]);acceptAuth(auth)}catch(error){setStatus('authStatus',error.message||'No pudimos confirmar el código.',true)}finally{setFormBusy(form,false)}
  }
  function initGoogleIdentity(){
    const config=window.TAZMANY_CONFIG&&window.TAZMANY_CONFIG.auth||{};const message=document.getElementById('googleAuthMessage');if(isStaticPreview())return;
    if(!config.googleClientId){message.hidden=false;message.textContent='Google aún no está configurado. Puedes ingresar con código por correo.';return}
    if(!(window.google&&google.accounts&&google.accounts.id)){setTimeout(initGoogleIdentity,300);return}
    if(document.getElementById('googleButton').dataset.ready)return;state.googleNonce=newIdempotencyKey('google-nonce');google.accounts.id.initialize({client_id:config.googleClientId,callback:handleGoogleCredential,nonce:state.googleNonce,ux_mode:'popup'});google.accounts.id.renderButton(document.getElementById('googleButton'),{theme:'outline',size:'large',shape:'pill',text:'continue_with',width:360});document.getElementById('googleButton').dataset.ready='1';
  }
  async function handleGoogleCredential(response){
    setStatus('authStatus','Confirmando tu identidad con Google…',false);
    try{const auth=await callServerStrict('apiAuthenticateGoogle',[response.credential,state.googleNonce,deviceLabel(),newIdempotencyKey('google-login')]);acceptAuth(auth)}catch(error){setStatus('authStatus',error.message||'No pudimos confirmar tu cuenta de Google.',true)}
  }
  async function logout(){
    const token=sessionToken();try{if(token)await callServerStrict('apiLogout',[token])}catch(error){}localStorage.removeItem('tazmany_session_token');state.auth=null;state.customerLoaded=false;state.merchantLoaded=false;closeProfileMenu();updateAuthUi();navigate('home');showToast('Sesión cerrada','Tu acceso en este dispositivo terminó.');
  }
  async function openProfileDialog(){
    if(!state.auth)return openAuthDialog();const form=document.getElementById('profileForm');const cities=state.publicData&&state.publicData.cities||fallback.cities;const select=document.getElementById('profileCity');select.innerHTML=cities.map(city=>`<option value="${escapeHtml(city.id)}">${escapeHtml(city.name)}</option>`).join('');
    try{const profile=await callServerStrict('apiGetMyProfile',[sessionToken()]);form.firstName.value=profile.firstName||'';form.lastName.value=profile.lastName||'';form.documentType.value=profile.documentType||'DNI';form.phone.value='';form.primaryCityId.value=profile.primaryCityId||'city-lima';form.marketingConsent.checked=Boolean(profile.marketingConsent)}catch(error){}setStatus('profileStatus','',false);document.getElementById('profileDialog').showModal();
  }
  async function saveProfile(event){
    event.preventDefault();const form=event.currentTarget;const data=new FormData(form);const payload={firstName:data.get('firstName'),lastName:data.get('lastName'),documentType:data.get('documentType'),documentNumber:data.get('documentNumber'),phone:data.get('phone'),primaryCityId:data.get('primaryCityId'),cityIds:[data.get('primaryCityId')],acceptTerms:data.get('acceptTerms')==='on',acceptPrivacy:data.get('acceptPrivacy')==='on',marketingConsent:data.get('marketingConsent')==='on'};setFormBusy(form,true);setStatus('profileStatus','Guardando de forma segura…',false);
    try{await callServerStrict('apiSaveCustomerProfile',[sessionToken(),payload,newIdempotencyKey('profile-save')]);state.auth.needsProfile=false;state.auth.user.displayName=`${payload.firstName} ${payload.lastName}`;updateAuthUi();document.getElementById('profileDialog').close();showToast('Perfil actualizado','Tu información y aceptaciones quedaron registradas.')}catch(error){setStatus('profileStatus',error.message||'No pudimos guardar tu perfil.',true)}finally{setFormBusy(form,false)}
  }
  async function openSessionsDialog(){
    closeProfileMenu();const list=document.getElementById('sessionsList');list.innerHTML='<div class="loading-spinner"></div>';document.getElementById('sessionsDialog').showModal();try{const sessions=await callServerStrict('apiListSessions',[sessionToken()]);list.innerHTML=sessions.map(item=>`<article class="session-row"><span><i class="icon" data-icon="shield"></i></span><div><strong>${escapeHtml(item.deviceLabel)}</strong><small>Vence ${date(item.expiresAt)}</small></div>${item.current?'<b class="session-current">Actual</b>':`<button type="button" data-revoke-session="${escapeHtml(item.id)}">Cerrar</button>`}</article>`).join('');hydrateIcons(list);list.querySelectorAll('[data-revoke-session]').forEach(button=>button.onclick=async()=>{await callServerStrict('apiRevokeSession',[sessionToken(),button.dataset.revokeSession]);button.closest('.session-row').remove();showToast('Sesión cerrada','El otro dispositivo perdió el acceso.')})}catch(error){list.innerHTML=`<div class="auth-status error">${escapeHtml(error.message||'No pudimos cargar tus sesiones.')}</div>`}
  }
  function handleProtectedError(error,target){target.innerHTML=`<div class="dashboard-placeholder"><span class="brand-mark"><span>T</span></span><h1>Acceso protegido</h1><p>${escapeHtml(error.message||'Inicia sesión para continuar.')}</p><button class="button button-primary" type="button" id="protectedLoginButton">Ingresar</button></div>`;target.querySelector('#protectedLoginButton').onclick=openAuthDialog}
  function showToast(title,message){const toast=make('div','toast',`<strong>${escapeHtml(title)}</strong><span>${escapeHtml(message)}</span>`);document.getElementById('toastRegion').append(toast);setTimeout(()=>toast.remove(),3500)}
  function make(tag,className,html){const el=document.createElement(tag);el.className=className;el.innerHTML=html;return el}function setText(id,value){document.getElementById(id).textContent=value||''}function normalize(value){return String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
